name: Monitor Bacalaureat 2026

on:
  # DEZACTIVAT: serverele GitHub nu pot accesa site-ul (blocat pe IP-uri din afara
  # Romaniei -> timeout). Monitorul ruleaza pe PC-ul din Romania: run_monitor.ps1
  # pornit automat din folderul Startup. Vezi README.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {} # doar pornire manuala

# O singura rulare activa; urmatoarea se pune la coada si porneste imediat ce
# se termina cea curenta (fara suprapuneri, fara goluri).
concurrency:
  group: bac-monitor
  cancel-in-progress: false

permissions:
  contents: write # pentru a salva state.json inapoi in repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruleaza monitorul (buclă la 30s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: "30" # verifica la fiecare 30 de secunde
          LOOP_DURATION: "960" # ruleaza bucla ~16 min (peste intervalul de cron de 15 min)
        run: python -u monitor.py

      - name: Salveaza starea daca s-a schimbat
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "bac-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "Starea nu s-a schimbat."
          fi
